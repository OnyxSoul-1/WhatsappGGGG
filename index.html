<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>whatsappDIaa</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111b21">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wa_bg: '#111b21', wa_header: '#202c33', wa_input: '#2a3942',
                        wa_green: '#00a884', wa_border: '#222d34'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b141a; color: #e9edef; font-family: sans-serif; }
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #374151; }
        
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        
        /* CRYSTAL CLEAR - NO OVERLAY */
        .chat-bg-overlay { display: none; }
        .chat-bg-image { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: -1; }
        
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(2.5); opacity: 0; } }
        .pulse-ring { animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        .modal-bg { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        
        /* SUPER CLEAR GLASS BUBBLES */
        .glass-bubble {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-bubble-received {
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .message-text {
            color: var(--msg-color, #ffffff);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        
        .filter-bw { filter: grayscale(100%); }
        .filter-sepia { filter: sepia(100%); }
        .filter-invert { filter: invert(100%); }
        .filter-neon { filter: hue-rotate(180deg) saturate(200%); }

        .message-actions { opacity: 0; transition: opacity 0.2s; }
        .message-wrapper:hover .message-actions { opacity: 1; }
        
        /* CAMERA UI */
        .camera-overlay {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: none; flex-direction: column;
        }
        .camera-overlay.active { display: flex; }
        #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
        .camera-controls {
            position: absolute; bottom: 40px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 40px; align-items: center;
        }
        .record-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: white; border: 4px solid rgba(255,255,255,0.5);
            cursor: pointer; transition: all 0.3s;
        }
        .record-btn.recording {
            background: #ef4444; border-color: #fff;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .close-camera {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.5); color: white;
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; z-index: 10000;
        }
        .switch-camera {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0,0,0,0.5); color: white;
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; z-index: 10000;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center">

    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-wa_bg flex items-center justify-center p-4">
        <div class="bg-wa_header p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-wa_border">
            <h1 class="text-2xl font-bold text-wa_green mb-4 text-center">whatsappDIaa</h1>
            <div class="flex justify-center mb-4">
                <label class="relative cursor-pointer">
                    <img id="avatarPreview" src="https://via.placeholder.com/100" class="w-20 h-20 rounded-full object-cover border-2 border-wa_green">
                    <input type="file" id="avatarInput" class="hidden" accept="image/*" onchange="previewImage(event)">
                    <i class="fas fa-camera absolute bottom-0 right-0 bg-wa_green p-1.5 rounded-full text-xs"></i>
                </label>
            </div>
            <input type="text" id="usernameInput" placeholder="Username" class="w-full bg-wa_input px-4 py-3 rounded-lg mb-3 focus:outline-none focus:ring-2 focus:ring-wa_green">
            <input type="password" id="passwordInput" placeholder="Family Secret Password" class="w-full bg-wa_input px-4 py-3 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-wa_green">
            <button onclick="login()" class="w-full bg-wa_green text-white font-bold py-3 rounded-lg">Enter</button>
            <p id="loginError" class="text-red-500 text-center text-sm mt-3 hidden">Wrong password or missing info!</p>
        </div>
    </div>

    <!-- 2. MAIN APP -->
    <div id="mainApp" class="hidden w-full h-full max-w-[1600px] mx-auto bg-wa_bg shadow-2xl md:flex overflow-hidden">
        <div class="w-full md:w-[350px] flex flex-col border-r border-wa_border bg-wa_bg relative z-10">
            <div class="bg-wa_header px-4 py-3 flex justify-between items-center">
                <img id="myAvatar" src="" class="w-10 h-10 rounded-full object-cover cursor-pointer" onclick="openProfileEdit()" title="Edit Profile">
                <div class="flex gap-4 text-gray-400">
                    <button onclick="openAddModal()" class="hover:text-white"><i class="fas fa-user-plus"></i></button>
                    <button onclick="openBgModal()" class="hover:text-white"><i class="fas fa-palette"></i></button>
                </div>
            </div>
            
            <div class="p-2 bg-wa_bg border-b border-wa_border">
                <input type="text" id="searchUser" onkeyup="filterUsers()" placeholder="Search or add people..." class="w-full bg-wa_input px-4 py-2 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-wa_green">
            </div>

            <div id="userList" class="flex-1 overflow-y-auto p-2"></div>
        </div>

        <div class="flex-1 flex flex-col relative bg-wa_chat_bg" id="chatArea">
            <div id="bgImageLayer" class="chat-bg-image"></div>

            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-center p-8 relative z-10">
                <h1 class="text-3xl font-light mb-4">whatsappDIaa Web</h1>
                <p class="text-gray-400">Select a contact to start messaging.</p>
            </div>

            <div id="activeChatUI" class="hidden flex-1 flex flex-col h-full relative z-10">
                <div class="bg-wa_header px-4 py-2.5 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <img id="chatAvatar" src="" class="w-10 h-10 rounded-full object-cover">
                        <h2 id="chatName" class="text-lg"></h2>
                    </div>
                    <div class="flex gap-4 text-gray-400 text-lg items-center">
                        <input type="color" id="textColorPicker" value="#ffffff" onchange="changeTextColor(this.value)" class="w-6 h-6 rounded cursor-pointer bg-transparent border-none" title="Change Text Color">
                        <button onclick="startCall('video')" title="Video Call"><i class="fas fa-video hover:text-white"></i></button>
                        <button onclick="startCall('voice')" title="Voice Call"><i class="fas fa-phone hover:text-white"></i></button>
                    </div>
                </div>
                <div id="messagesArea" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2"></div>
                <div class="bg-wa_header px-4 py-3 flex items-center gap-3">
                    <input type="text" id="msgInput" placeholder="Message" class="flex-1 bg-wa_input px-4 py-2 rounded-lg focus:outline-none" onkeypress="if(event.key==='Enter') sendText()">
                    
                    <select id="voiceEffect" class="bg-wa_input text-xs text-gray-300 rounded px-2 py-2 focus:outline-none cursor-pointer">
                        <option value="1">Normal</option>
                        <option value="1.5">Chipmunk</option>
                        <option value="0.75">Monster</option>
                    </select>

                    <!-- CAMERA BUTTON -->
                    <button onclick="openCamera()" class="text-wa_green text-2xl p-2 cursor-pointer hover:scale-110 transition" title="Take Photo/Video">
                        <i class="fas fa-camera"></i>
                    </button>

                    <button id="micBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()" class="text-wa_green text-2xl p-2 cursor-pointer select-none">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button onclick="sendText()" class="text-wa_green text-2xl p-2"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. ADD PEOPLE MODAL -->
    <div id="addModal" class="hidden fixed inset-0 z-[100] modal-bg flex items-center justify-center p-4">
        <div class="bg-wa_header p-6 rounded-2xl w-full max-w-sm border border-wa_border">
            <h2 class="text-xl font-bold mb-4">Add Family Member</h2>
            <input type="text" id="addUserInput" placeholder="Enter username..." class="w-full bg-wa_input px-4 py-3 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-wa_green">
            <div class="flex gap-3">
                <button onclick="closeAddModal()" class="flex-1 bg-gray-600 py-2 rounded-lg">Cancel</button>
                <button onclick="searchAndAddUser()" class="flex-1 bg-wa_green py-2 rounded-lg font-bold">Find & Chat</button>
            </div>
        </div>
    </div>

    <!-- 4. BACKGROUND MODAL -->
    <div id="bgModal" class="hidden fixed inset-0 z-[100] modal-bg flex items-center justify-center p-4">
        <div class="bg-wa_header p-6 rounded-2xl w-full max-w-sm border border-wa_border">
            <h2 class="text-xl font-bold mb-4">Change Chat Background</h2>
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Upload from Files (Image/Video/GIF)</label>
                <input type="file" id="bgFileInput" accept="image/*,video/*,.gif" onchange="uploadBg(event)" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-wa_green file:text-white hover:file:bg-[#008f6f]">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Or Paste Image URL</label>
                <input type="text" id="bgUrlInput" placeholder="https://..." class="w-full bg-wa_input px-4 py-2 rounded-lg focus:outline-none">
            </div>
            <div class="flex gap-3">
                <button onclick="applyBgUrl()" class="flex-1 bg-wa_green py-2 rounded-lg font-bold">Apply URL</button>
                <button onclick="closeBgModal()" class="flex-1 bg-gray-600 py-2 rounded-lg">Close</button>
            </div>
        </div>
    </div>

    <!-- 5. PROFILE EDIT MODAL -->
    <div id="profileModal" class="hidden fixed inset-0 z-[100] modal-bg flex items-center justify-center p-4">
        <div class="bg-wa_header p-6 rounded-2xl w-full max-w-sm border border-wa_border">
            <h2 class="text-xl font-bold mb-4">Edit Profile</h2>
            <div class="flex justify-center mb-4">
                <label class="relative cursor-pointer">
                    <img id="profileAvatarPreview" src="" class="w-24 h-24 rounded-full object-cover border-2 border-wa_green">
                    <input type="file" id="profileAvatarInput" class="hidden" accept="image/*" onchange="updateProfileAvatar(event)">
                    <i class="fas fa-camera absolute bottom-0 right-0 bg-wa_green p-2 rounded-full text-sm"></i>
                </label>
            </div>
            <input type="text" id="profileNameInput" placeholder="Your Name" class="w-full bg-wa_input px-4 py-3 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-wa_green">
            <div class="flex gap-3">
                <button onclick="closeProfileEdit()" class="flex-1 bg-gray-600 py-2 rounded-lg">Cancel</button>
                <button onclick="saveProfile()" class="flex-1 bg-wa_green py-2 rounded-lg font-bold">Save</button>
            </div>
        </div>
    </div>

    <!-- 6. CAMERA OVERLAY -->
    <div id="cameraOverlay" class="camera-overlay">
        <div class="close-camera" onclick="closeCamera()"><i class="fas fa-times"></i></div>
        <div class="switch-camera" onclick="switchCamera()"><i class="fas fa-sync-alt"></i></div>
        <video id="cameraVideo" autoplay playsinline></video>
        <div class="camera-controls">
            <div class="record-btn" id="cameraRecordBtn" onmousedown="startCameraRecording()" onmouseup="stopCameraRecording()" ontouchstart="startCameraRecording()" ontouchend="stopCameraRecording()"></div>
        </div>
    </div>

    <!-- 7. CALLING UIs -->
    <div id="incomingCallUI" class="hidden fixed inset-0 z-[100] bg-[#0b141a] flex flex-col items-center justify-center text-white">
        <div class="relative mb-8">
            <div class="absolute inset-0 bg-wa_green rounded-full pulse-ring"></div>
            <img id="incomingAvatar" src="" class="relative w-32 h-32 rounded-full object-cover border-4 border-wa_bg z-10">
        </div>
        <h2 id="incomingName" class="text-3xl font-light mb-2">Incoming Call...</h2>
        <p id="incomingCallType" class="text-gray-400 mb-12">Video Call</p>
        <div class="flex gap-12 mt-12">
            <button onclick="declineCall()" class="bg-red-500 w-16 h-16 rounded-full flex items-center justify-center text-2xl"><i class="fas fa-phone-slash"></i></button>
            <button onclick="acceptCall()" class="bg-wa_green w-16 h-16 rounded-full flex items-center justify-center text-2xl"><i class="fas fa-phone"></i></button>
        </div>
    </div>

    <div id="activeCallUI" class="hidden fixed inset-0 z-[100] bg-black flex flex-col">
        <video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full"></video>
        <video id="localVideo" autoplay playsinline muted class="absolute bottom-20 right-4 w-32 h-48 rounded-lg border-2 border-white z-10 bg-gray-800"></video>
        <div class="absolute top-0 left-0 w-full p-4 bg-gradient-to-b from-black/80 to-transparent z-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img id="activeCallAvatar" src="" class="w-10 h-10 rounded-full">
                <div><h3 id="activeCallName" class="font-bold"></h3><p id="callStatus" class="text-sm text-gray-300">Connecting...</p></div>
            </div>
            <button onclick="cycleVideoFilter()" class="text-white text-xl hover:text-wa_green transition" title="Change Video Filter"><i class="fas fa-wand-magic-sparkles"></i></button>
        </div>
        <div class="absolute bottom-10 left-0 w-full flex justify-center gap-8 z-20">
            <button onclick="toggleMute()" class="bg-gray-700 p-4 rounded-full text-xl"><i class="fas fa-microphone"></i></button>
            <button onclick="endCall()" class="bg-red-500 p-4 rounded-full text-xl"><i class="fas fa-phone-slash"></i></button>
            <button onclick="toggleVideo()" class="bg-gray-700 p-4 rounded-full text-xl"><i class="fas fa-video"></i></button>
        </div>
    </div>

    <audio id="ringtone" src="https://www.myinstants.com/media/sounds/iphone-ringtone.mp3" loop></audio>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const SERVER_URL = "https://whatsappgggg.onrender.com/";
        const FAMILY_SECRET_PASSWORD = "hassan123";
        
        const socket = io(SERVER_URL);
        let myData = null;
        let activeUser = null;
        let peer = null;
        let localStream = null;
        let isMuted = false;
        let isVideoOff = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let incomingSignal = null;
        let incomingCaller = null;
        let callType = 'video';
        let allUsers = [];
        let isRecording = false;
        let sentMessages = new Set();
        let currentFilterIndex = 0;
        const videoFilters = ['', 'filter-bw', 'filter-sepia', 'filter-invert', 'filter-neon'];
        
        // Camera variables
        let cameraStream = null;
        let cameraRecorder = null;
        let cameraChunks = [];
        let facingMode = 'user';

        // ==========================================
        // 1. LOGIN & SAVING
        // ==========================================
        window.onload = () => {
            const saved = localStorage.getItem('diaa_user');
            if (saved) {
                myData = JSON.parse(saved);
                showApp();
            }
            loadSavedBg();
            loadSavedTextColor();
        };

        function previewImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => document.getElementById('avatarPreview').src = ev.target.result;
                reader.readAsDataURL(file);
            }
        }

        function login() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const avatar = document.getElementById('avatarPreview').src;
            
            if (username && !avatar.includes('placeholder') && password === FAMILY_SECRET_PASSWORD) {
                myData = { username, password, avatar };
                localStorage.setItem('diaa_user', JSON.stringify(myData));
                showApp();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function showApp() {
            socket.emit('register_user', myData);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('flex');
            document.getElementById('myAvatar').src = myData.avatar;
        }

        // ==========================================
        // 2. PROFILE EDITING
        // ==========================================
        function openProfileEdit() {
            document.getElementById('profileNameInput').value = myData.username;
            document.getElementById('profileAvatarPreview').src = myData.avatar;
            document.getElementById('profileModal').classList.remove('hidden');
        }

        function closeProfileEdit() {
            document.getElementById('profileModal').classList.add('hidden');
        }

        function updateProfileAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => document.getElementById('profileAvatarPreview').src = ev.target.result;
                reader.readAsDataURL(file);
            }
        }

        function saveProfile() {
            const newName = document.getElementById('profileNameInput').value.trim();
            const newAvatar = document.getElementById('profileAvatarPreview').src;
            
            if (newName && newAvatar) {
                myData.username = newName;
                myData.avatar = newAvatar;
                localStorage.setItem('diaa_user', JSON.stringify(myData));
                document.getElementById('myAvatar').src = newAvatar;
                socket.emit('register_user', myData);
                closeProfileEdit();
            }
        }

        // ==========================================
        // 3. REAL-TIME USERS & SEARCH
        // ==========================================
        socket.on('update_user_list', (users) => {
            allUsers = users.filter(u => u.username !== myData.username);
            renderUserList(allUsers);
        });

        function renderUserList(usersToRender) {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            if(usersToRender.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-500 mt-4 text-sm">No users found.</p>';
                return;
            }
            usersToRender.forEach(u => {
                list.innerHTML += `
                    <div onclick="openChat('${u.username}', '${u.avatar}')" class="flex items-center p-3 hover:bg-wa_header cursor-pointer border-b border-wa_border transition">
                        <img src="${u.avatar}" class="w-12 h-12 rounded-full mr-3">
                        <div><h3 class="font-bold">${u.username}</h3><p class="text-xs text-gray-400">Tap to chat</p></div>
                    </div>`;
            });
        }

        function filterUsers() {
            const query = document.getElementById('searchUser').value.toLowerCase();
            renderUserList(allUsers.filter(u => u.username.toLowerCase().includes(query)));
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addUserInput').value = ''; }
        
        function searchAndAddUser() {
            const name = document.getElementById('addUserInput').value.trim().toLowerCase();
            if(!name) return;
            document.getElementById('searchUser').value = name;
            filterUsers();
            closeAddModal();
        }

        // ==========================================
        // 4. MESSAGING
        // ==========================================
        function openChat(username, avatar) {
            activeUser = { username, avatar };
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('activeChatUI').classList.remove('hidden');
            document.getElementById('chatName').innerText = username;
            document.getElementById('chatAvatar').src = avatar;
            document.getElementById('messagesArea').innerHTML = '';
            sentMessages.clear();
        }

        function sendText() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text && activeUser) {
                const msgId = Date.now().toString() + Math.random().toString();
                const msg = { 
                    id: msgId, from: myData.username, to: activeUser.username, 
                    text, type: 'text', time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    color: document.getElementById('textColorPicker').value
                };
                socket.emit('send_message', msg);
                appendMessage(msg);
                input.value = '';
            }
        }

        socket.on('receive_message', (msg) => {
            if ((msg.to === myData.username || msg.from === myData.username) && 
                activeUser && (msg.from === activeUser.username || msg.to === activeUser.username)) {
                if (!sentMessages.has(msg.id)) {
                    appendMessage(msg);
                    sentMessages.add(msg.id);
                }
            }
        });

        function appendMessage(msg) {
            const area = document.getElementById('messagesArea');
            const isMe = msg.from === myData.username;
            const bubbleClass = isMe ? 'glass-bubble self-end' : 'glass-bubble-received self-start';
            const textColor = msg.color || '#ffffff';
            
            let content = msg.text;
            if (msg.type === 'voice') {
                const effect = document.getElementById('voiceEffect').value;
                content = `<audio controls src="${msg.text}" class="w-48" style="playbackRate: ${effect}"></audio>`;
            } else if (msg.type === 'photo') {
                content = `<img src="${msg.text}" class="max-w-full rounded-lg cursor-pointer" onclick="window.open(this.src)">`;
            } else if (msg.type === 'video') {
                content = `<video controls src="${msg.text}" class="max-w-full rounded-lg"></video>`;
            }
            
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper flex flex-col max-w-[70%] ' + (isMe ? 'self-end' : 'self-start');
            wrapper.innerHTML = `
                <div class="${bubbleClass} text-white px-3 py-2 rounded-lg shadow text-sm relative group">
                    <div class="message-text" style="color: ${textColor}">${content}</div>
                    <div class="flex justify-between items-center mt-1 gap-2">
                        <span class="text-[10px] text-gray-300">${msg.time}</span>
                        ${isMe ? `<button onclick="deleteMessage('${msg.id}', this)" class="message-actions text-[10px] text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                </div>
            `;
            area.appendChild(wrapper);
            area.scrollTop = area.scrollHeight;
        }

        function deleteMessage(msgId, btnElement) {
            btnElement.closest('.message-wrapper').remove();
            socket.emit('delete_message', { id: msgId, from: myData.username });
        }

        socket.on('message_deleted', (data) => {
            document.querySelectorAll('.message-wrapper').forEach(msgEl => {
                if (msgEl.innerHTML.includes(`'${data.id}'`)) msgEl.remove();
            });
        });

        // ==========================================
        // 5. VOICE NOTES
        // ==========================================
        async function startRecording() {
            if (isRecording) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = sendVoiceNote;
                mediaRecorder.start();
                isRecording = true;
                const btn = document.getElementById('micBtn');
                btn.classList.add('text-red-500', 'animate-pulse');
                btn.innerHTML = '<i class="fas fa-stop"></i>';
            } catch (err) { 
                console.error("Voice recording error:", err);
                alert("Microphone access denied!"); 
                isRecording = false; 
            }
        }

        function stopRecording() {
            if (!isRecording) return;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            isRecording = false;
            const btn = document.getElementById('micBtn');
            btn.classList.remove('text-red-500', 'animate-pulse');
            btn.innerHTML = '<i class="fas fa-microphone"></i>';
        }

        function sendVoiceNote() {
            if (audioChunks.length === 0) return;
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
                const msgId = Date.now().toString() + Math.random().toString();
                const msg = { 
                    id: msgId, from: myData.username, to: activeUser.username, 
                    text: reader.result, type: 'voice', 
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    color: document.getElementById('textColorPicker').value
                };
                socket.emit('send_message', msg);
                audioChunks = [];
            };
        }

        // ==========================================
        // 6. CAMERA (FIXED)
        // ==========================================
        async function openCamera() {
            console.log("Opening camera...");
            try {
                // Stop any existing stream
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }, 
                    audio: true 
                });
                
                console.log("Camera stream obtained:", cameraStream);
                const videoElement = document.getElementById('cameraVideo');
                videoElement.srcObject = cameraStream;
                
                document.getElementById('cameraOverlay').classList.add('active');
                console.log("Camera overlay shown");
            } catch (err) {
                console.error("Camera error:", err);
                alert("Camera access denied! Please allow camera permissions.");
            }
        }

        function closeCamera() {
            console.log("Closing camera...");
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            document.getElementById('cameraOverlay').classList.remove('active');
            document.getElementById('cameraRecordBtn').classList.remove('recording');
        }

        function switchCamera() {
            console.log("Switching camera...");
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                openCamera();
            }
        }

        function startCameraRecording() {
            console.log("Starting camera recording...");
            if (!cameraStream) {
                alert("Camera not ready!");
                return;
            }
            
            cameraChunks = [];
            const mediaRecorder = new MediaRecorder(cameraStream, { 
                mimeType: 'video/webm;codecs=vp9,opus'
            });
            
            mediaRecorder.ondataavailable = e => { 
                console.log("Data available:", e.data.size);
                if (e.data.size > 0) cameraChunks.push(e.data); 
            };
            
            mediaRecorder.onstop = sendCameraMedia;
            mediaRecorder.onerror = (e) => {
                console.error("Recorder error:", e);
            };
            
            mediaRecorder.start(100); // Collect data every 100ms
            cameraRecorder = mediaRecorder;
            document.getElementById('cameraRecordBtn').classList.add('recording');
            console.log("Recording started");
        }

        function stopCameraRecording() {
            console.log("Stopping camera recording...");
            if (cameraRecorder && cameraRecorder.state !== 'inactive') {
                cameraRecorder.stop();
                document.getElementById('cameraRecordBtn').classList.remove('recording');
                console.log("Recording stopped");
            }
        }

        function sendCameraMedia() {
            console.log("Sending camera media, chunks:", cameraChunks.length);
            if (cameraChunks.length === 0) {
                console.log("No chunks recorded");
                closeCamera();
                return;
            }
            
            const blob = new Blob(cameraChunks, { type: 'video/webm' });
            console.log("Blob size:", blob.size);
            
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                const msgId = Date.now().toString() + Math.random().toString();
                const msg = { 
                    id: msgId, from: myData.username, to: activeUser.username, 
                    text: reader.result, type: 'video', 
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    color: document.getElementById('textColorPicker').value
                };
                console.log("Sending video message");
                socket.emit('send_message', msg);
                closeCamera();
            };
        }

        // ==========================================
        // 7. VIDEO/VOICE CALLS
        // ==========================================
        async function startCall(type) {
            if (!activeUser) return;
            callType = type;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: type === 'video' ? { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } : false, 
                    audio: true 
                });
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;
                localVideo.style.display = type === 'video' ? 'block' : 'none';
                document.getElementById('activeCallUI').classList.remove('hidden');
                document.getElementById('activeCallName').innerText = activeUser.username;
                document.getElementById('activeCallAvatar').src = activeUser.avatar;
                document.getElementById('callStatus').innerText = type === 'video' ? "Video calling..." : "Voice calling...";
                
                peer = new SimplePeer({ 
                    initiator: true, trickle: false, stream: localStream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
                });

                peer.on('signal', data => {
                    socket.emit('call_user', { userToCall: activeUser.username, signal: data, from: myData.username, name: myData.username, type: type });
                });

                peer.on('stream', remoteStream => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.play().catch(e => console.error('Video play error:', e));
                    document.getElementById('callStatus').innerText = type === 'video' ? "Video connected" : "Voice connected";
                    document.getElementById('ringtone').pause();
                });

                document.getElementById('ringtone').play();
            } catch (err) {
                console.error("Call error:", err);
                alert("Camera/Mic access denied!");
            }
        }

        socket.on('incoming_call', (data) => {
            incomingSignal = data.signal;
            incomingCaller = { username: data.from, name: data.name };
            callType = data.type || 'video';
            document.getElementById('incomingName').innerText = `${data.name} is calling...`;
            document.getElementById('incomingCallType').innerText = callType === 'video' ? 'Video Call' : 'Voice Call';
            document.getElementById('incomingCallUI').classList.remove('hidden');
            document.getElementById('ringtone').play();
        });

        async function acceptCall() {
            try {
                document.getElementById('incomingCallUI').classList.add('hidden');
                document.getElementById('activeCallUI').classList.remove('hidden');
                document.getElementById('activeCallName').innerText = incomingCaller.name;
                document.getElementById('ringtone').pause();

                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: callType === 'video' ? { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } : false, 
                    audio: true 
                });
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;
                localVideo.style.display = callType === 'video' ? 'block' : 'none';

                peer = new SimplePeer({ 
                    initiator: false, trickle: false, stream: localStream,
                    config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
                });

                peer.on('signal', data => {
                    socket.emit('answer_call', { signal: data, to: incomingCaller.username });
                });

                peer.on('stream', remoteStream => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.play().catch(e => console.error('Video play error:', e));
                    document.getElementById('callStatus').innerText = callType === 'video' ? "Video connected" : "Voice connected";
                });

                peer.signal(incomingSignal);
            } catch (err) {
                console.error("Accept call error:", err);
                alert("Camera/Mic access denied!");
            }
        }

        function declineCall() { 
            document.getElementById('incomingCallUI').classList.add('hidden'); 
            document.getElementById('ringtone').pause(); 
        }
        
        socket.on('call_accepted', (data) => {
            if (peer) peer.signal(data.signal);
        });

        function endCall() {
            document.getElementById('activeCallUI').classList.add('hidden');
            document.getElementById('incomingCallUI').classList.add('hidden');
            document.getElementById('ringtone').pause();
            if (peer) { peer.destroy(); peer = null; }
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('localVideo').srcObject = null;
            currentFilterIndex = 0;
            const remoteVideo = document.getElementById('remoteVideo');
            const localVideo = document.getElementById('localVideo');
            videoFilters.forEach(f => { if(f) { remoteVideo.classList.remove(f); localVideo.classList.remove(f); }});
        }

        function toggleMute() { 
            isMuted = !isMuted; 
            if (localStream) localStream.getAudioTracks()[0].enabled = !isMuted; 
        }
        
        function toggleVideo() { 
            isVideoOff = !isVideoOff; 
            if (localStream && callType === 'video') localStream.getVideoTracks()[0].enabled = !isVideoOff; 
        }

        // ==========================================
        // 8. BACKGROUNDS & COLORS
        // ==========================================
        function openBgModal() { document.getElementById('bgModal').classList.remove('hidden'); }
        function closeBgModal() { document.getElementById('bgModal').classList.add('hidden'); }

        function uploadBg(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    applyBackground(e.target.result);
                    localStorage.setItem('diaa_bg', e.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function applyBgUrl() {
            const url = document.getElementById('bgUrlInput').value.trim();
            if (url) {
                applyBackground(url);
                localStorage.setItem('diaa_bg', url);
            }
        }

        function applyBackground(url) {
            const layer = document.getElementById('bgImageLayer');
            layer.style.backgroundImage = `url('${url}')`;
            closeBgModal();
        }

        function loadSavedBg() {
            const saved = localStorage.getItem('diaa_bg');
            if (saved) {
                document.getElementById('bgImageLayer').style.backgroundImage = `url('${saved}')`;
            } else {
                applyBackground('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2000&auto=format&fit=crop');
            }
        }

        function changeTextColor(color) {
            document.documentElement.style.setProperty('--msg-color', color);
            localStorage.setItem('diaa_text_color', color);
        }
        
        function loadSavedTextColor() {
            const saved = localStorage.getItem('diaa_text_color');
            if (saved) {
                document.getElementById('textColorPicker').value = saved;
                changeTextColor(saved);
            }
        }

        function cycleVideoFilter() {
            currentFilterIndex = (currentFilterIndex + 1) % videoFilters.length;
            const filterClass = videoFilters[currentFilterIndex];
            const remoteVideo = document.getElementById('remoteVideo');
            const localVideo = document.getElementById('localVideo');
            videoFilters.forEach(f => { if(f) { remoteVideo.classList.remove(f); localVideo.classList.remove(f); }});
            if (filterClass) {
                remoteVideo.classList.add(filterClass);
                localVideo.classList.add(filterClass);
            }
        }
    </script>
</body>
</html>
