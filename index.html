<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>whatsappDIaa</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111b21">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script>tailwind.config = { theme: { extend: { colors: { wa_bg: '#111b21', wa_header: '#202c33', wa_input: '#2a3942', wa_green: '#00a884', wa_border: '#222d34' } } } }</script>
    <style>
        body { background-color: #0b141a; color: #e9edef; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .chat-bg-image { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
        @keyframes pulse-ring { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(2.5); opacity: 0; } }
        .pulse-ring { animation: pulse-ring 1.5s infinite; }
        .modal-bg { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        .glass-bubble { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.4); }
        .glass-bubble-received { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .message-text { color: var(--msg-color, #ffffff); text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .camera-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .camera-overlay.active { display: flex; }
        #cameraVideo { width: 100%; height: 100%; object-fit: cover; }
        .record-btn { width: 70px; height: 70px; border-radius: 50%; background: white; border: 4px solid rgba(255,255,255,0.5); cursor: pointer; }
        .record-btn.recording { background: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .close-camera { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.5); color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #bootScreen { position: fixed; inset: 0; background: #111b21; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .boot-spinner { width: 50px; height: 50px; border: 4px solid #202c33; border-top: 4px solid #00a884; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex">
    <div id="bootScreen"><div class="boot-spinner mb-4"></div><h1 class="text-2xl font-bold text-wa_green">Loading...</h1></div>

    <div id="loginScreen" class="hidden fixed inset-0 z-50 bg-wa_bg flex items-center justify-center p-4">
        <div class="bg-wa_header p-6 rounded-2xl w-full max-w-sm">
            <h1 class="text-2xl font-bold text-wa_green mb-4 text-center">whatsappDIaa</h1>
            <input type="text" id="usernameInput" placeholder="Username" class="w-full bg-wa_input px-4 py-3 rounded-lg mb-3">
            <input type="password" id="passwordInput" placeholder="Password (hassan123)" class="w-full bg-wa_input px-4 py-3 rounded-lg mb-4">
            <button onclick="login()" class="w-full bg-wa_green text-white font-bold py-3 rounded-lg">Enter</button>
        </div>
    </div>

    <div id="mainApp" class="hidden w-full h-full flex">
        <div id="sidebar" class="w-80 bg-wa_bg border-r border-wa_border flex flex-col">
            <div class="bg-wa_header px-4 py-3 flex justify-between items-center">
                <img id="myAvatar" src="" class="w-10 h-10 rounded-full">
                <div class="flex gap-4 text-gray-400">
                    <button onclick="alert('Profile: ' + myData.username)"><i class="fas fa-user"></i></button>
                    <button onclick="alert('Background settings')"><i class="fas fa-palette"></i></button>
                </div>
            </div>
            <div id="userList" class="flex-1 overflow-y-auto p-2"></div>
        </div>

        <div id="chatArea" class="flex-1 flex flex-col relative">
            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center">
                <h1 class="text-3xl mb-4">whatsappDIaa</h1>
                <p>Select a contact</p>
            </div>
            <div id="activeChatUI" class="hidden flex-1 flex flex-col">
                <div class="bg-wa_header px-4 py-3 flex items-center gap-3">
                    <img id="chatAvatar" class="w-10 h-10 rounded-full">
                    <h2 id="chatName" class="text-lg"></h2>
                    <div class="ml-auto flex gap-4">
                        <button onclick="startCall('video')" class="text-gray-400 hover:text-white"><i class="fas fa-video"></i></button>
                        <button onclick="startCall('voice')" class="text-gray-400 hover:text-white"><i class="fas fa-phone"></i></button>
                    </div>
                </div>
                <div id="messagesArea" class="flex-1 overflow-y-auto p-4"></div>
                <div class="bg-wa_header px-4 py-3 flex gap-2">
                    <input type="text" id="msgInput" placeholder="Message" class="flex-1 bg-wa_input px-4 py-2 rounded-lg" onkeypress="if(event.key==='Enter') sendText()">
                    <button onclick="sendText()" class="text-wa_green"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- INCOMING CALL UI -->
    <div id="incomingCallUI" class="hidden fixed inset-0 z-[100] bg-black flex flex-col items-center justify-center text-white">
        <div class="relative mb-8"><div class="absolute inset-0 bg-wa_green rounded-full pulse-ring"></div><img id="incomingAvatar" src="" class="relative w-32 h-32 rounded-full border-4 border-wa_bg z-10"></div>
        <h2 id="incomingName" class="text-3xl mb-2">Incoming Call...</h2>
        <p id="incomingCallType" class="text-gray-400 mb-12">Video Call</p>
        <div class="flex gap-12">
            <button onclick="declineCall()" class="bg-red-500 w-16 h-16 rounded-full"><i class="fas fa-phone-slash text-2xl"></i></button>
            <button onclick="acceptCall()" class="bg-wa_green w-16 h-16 rounded-full"><i class="fas fa-phone text-2xl"></i></button>
        </div>
    </div>

    <!-- ACTIVE CALL UI -->
    <div id="activeCallUI" class="hidden fixed inset-0 z-[100] bg-black flex flex-col">
        <!-- Remote Video (The other person) -->
        <video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full bg-gray-900"></video>
        <!-- Local Video (You) -->
        <video id="localVideo" autoplay playsinline muted class="absolute bottom-20 right-4 w-32 h-48 rounded-lg border-2 border-white bg-gray-800"></video>
        
        <div class="absolute top-4 left-4 text-white z-10">
            <h3 id="activeCallName" class="font-bold text-lg"></h3>
            <p id="callStatus" class="text-sm text-gray-300">Connecting...</p>
        </div>
        <div class="absolute bottom-10 flex justify-center gap-8 z-10">
            <button onclick="endCall()" class="bg-red-500 w-16 h-16 rounded-full"><i class="fas fa-phone-slash text-2xl"></i></button>
        </div>
    </div>

    <audio id="ringtone" src="https://www.myinstants.com/media/sounds/iphone-ringtone.mp3" loop></audio>

    <script>
        const SERVER_URL = "https://whatsappgggg.onrender.com"; 
        const socket = io(SERVER_URL, { reconnection: true, reconnectionDelay: 1000 });
        
        let myData = null, activeUser = null, peer = null, localStream = null;
        let incomingSignal = null, incomingCaller = null, callType = 'video';

        // FIX 1: Re-register when connection is stable
        socket.on('connect', () => {
            console.log("Connected to server!");
            if (myData) {
                socket.emit('register_user', myData);
            }
        });

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('bootScreen').style.display = 'none';
                const saved = localStorage.getItem('diaa_user');
                if (saved) { myData = JSON.parse(saved); showApp(); }
                else { document.getElementById('loginScreen').classList.remove('hidden'); }
            }, 1000);
        };

        function login() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            if (username && password === 'hassan123') {
                myData = { username, password, avatar: 'https://via.placeholder.com/100' };
                localStorage.setItem('diaa_user', JSON.stringify(myData));
                showApp();
            } else { alert('Wrong password!'); }
        }

        function showApp() {
            socket.emit('register_user', myData);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('myAvatar').src = myData.avatar;
        }

        socket.on('update_user_list', (users) => {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            console.log("Users online:", users);
            users.filter(u => u.username !== myData.username).forEach(u => {
                list.innerHTML += `<div onclick="openChat('${u.username}', '${u.avatar}')" class="flex items-center p-3 hover:bg-wa_header cursor-pointer border-b border-wa_border">
                    <img src="${u.avatar}" class="w-12 h-12 rounded-full mr-3">
                    <div><h3 class="font-bold">${u.username}</h3></div></div>`;
            });
        });

        function openChat(username, avatar) {
            activeUser = { username, avatar };
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('activeChatUI').classList.remove('hidden');
            document.getElementById('chatName').innerText = username;
            document.getElementById('chatAvatar').src = avatar;
        }

        function sendText() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text && activeUser) {
                socket.emit('send_message', { from: myData.username, to: activeUser.username, text, type: 'text', time: new Date().toLocaleTimeString() });
                appendMessage({ from: myData.username, text, time: new Date().toLocaleTimeString() }, true);
                input.value = '';
            }
        }

        socket.on('receive_message', (msg) => {
            if (activeUser && (msg.from === activeUser.username || msg.to === activeUser.username)) {
                appendMessage(msg, false);
            }
        });

        function appendMessage(msg, isMe) {
            const area = document.getElementById('messagesArea');
            const bubble = document.createElement('div');
            bubble.className = `p-3 rounded-lg mb-2 max-w-[70%] ${isMe ? 'glass-bubble ml-auto' : 'glass-bubble-received'}`;
            bubble.innerHTML = `<div class="message-text">${msg.text}</div><div class="text-xs text-gray-400 mt-1">${msg.time}</div>`;
            area.appendChild(bubble);
            area.scrollTop = area.scrollHeight;
        }

        // ==========================================
        // CALL LOGIC (FIXED FOR PHONE & INCOMING)
        // ==========================================
        async function startCall(type) {
            if (!activeUser) { alert('Select a user first!'); return; }
            callType = type;
            
            try {
                // Get Camera/Mic
                localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
                
                // Show Call UI
                document.getElementById('activeCallUI').classList.remove('hidden');
                document.getElementById('activeCallName').innerText = activeUser.username;
                document.getElementById('callStatus').innerText = "Calling...";
                
                // FIX 2: Force local video to show on phone
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;
                localVideo.onloadedmetadata = () => { localVideo.play(); };

                // Create Peer
                peer = new SimplePeer({ initiator: true, trickle: false, stream: localStream });
                
                peer.on('signal', data => {
                    console.log("Sending signal to:", activeUser.username);
                    socket.emit('call_user', { 
                        userToCall: activeUser.username, 
                        signal: data, 
                        from: myData.username, 
                        name: myData.username, 
                        type: type 
                    });
                });
                
                peer.on('stream', remoteStream => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.onloadedmetadata = () => { remoteVideo.play(); };
                    document.getElementById('callStatus').innerText = 'Connected';
                });
                
                peer.on('error', err => {
                    console.error("Peer Error:", err);
                    alert('Call failed: ' + err.message);
                    endCall();
                });
                
            } catch (err) {
                alert('Camera/Mic error: ' + err.message);
            }
        }

        // FIX 3: Incoming Call Listener
        socket.on('incoming_call', (data) => {
            console.log("INCOMING CALL FROM:", data.name);
            incomingSignal = data.signal;
            incomingCaller = data.from;
            callType = data.type || 'video';
            
            document.getElementById('incomingName').innerText = data.name + ' is calling...';
            document.getElementById('incomingCallType').innerText = callType === 'video' ? 'Video Call' : 'Voice Call';
            document.getElementById('incomingCallUI').classList.remove('hidden');
            
            // Play sound
            const ringtone = document.getElementById('ringtone');
            ringtone.currentTime = 0;
            ringtone.play().catch(e => console.log("Audio play blocked"));
        });

        async function acceptCall() {
            try {
                document.getElementById('incomingCallUI').classList.add('hidden');
                document.getElementById('activeCallUI').classList.remove('hidden');
                document.getElementById('activeCallName').innerText = incomingCaller;
                document.getElementById('callStatus').innerText = "Connecting...";
                document.getElementById('ringtone').pause();
                
                localStream = await navigator.mediaDevices.getUserMedia({ video: callType === 'video', audio: true });
                
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;
                localVideo.onloadedmetadata = () => { localVideo.play(); };

                peer = new SimplePeer({ initiator: false, trickle: false, stream: localStream });
                
                peer.on('signal', data => {
                    socket.emit('answer_call', { signal: data, to: incomingCaller });
                });
                
                peer.on('stream', remoteStream => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                    remoteVideo.onloadedmetadata = () => { remoteVideo.play(); };
                    document.getElementById('callStatus').innerText = 'Connected';
                });

                peer.signal(incomingSignal);
                
            } catch (err) {
                alert('Camera error: ' + err.message);
            }
        }

        function declineCall() {
            document.getElementById('incomingCallUI').classList.add('hidden');
            document.getElementById('ringtone').pause();
        }

        function endCall() {
            document.getElementById('activeCallUI').classList.add('hidden');
            document.getElementById('incomingCallUI').classList.add('hidden');
            document.getElementById('ringtone').pause();
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); }
            if (peer) { peer.destroy(); }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('localVideo').srcObject = null;
        }
    </script>
</body>
</html>
