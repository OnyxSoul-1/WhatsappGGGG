<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>whatsappDIaa</title>
<meta name="theme-color" content="#111b21">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
<style>
:root{--g:#00a884;--bg:#111b21;--hd:#202c33;--in:#2a3942}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#0b141a;color:#e9edef;font-family:system-ui,sans-serif}
.hide{display:none!important}
input,button{font:inherit}
input[type=text],input[type=password]{width:100%;background:var(--in);color:inherit;border:0;border-radius:8px;padding:12px;margin-bottom:12px;outline:none}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:12px;width:100%;font-weight:700;cursor:pointer}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px;z-index:5}
.card{background:var(--hd);padding:24px;border-radius:16px;width:100%;max-width:340px;text-align:center}
.card h1{color:var(--g);margin:0 0 16px}
#app{display:flex;height:100dvh;max-width:1600px;margin:auto;background:var(--bg)}
#side{width:340px;border-right:1px solid #222d34;display:flex;flex-direction:column}
#list{flex:1;overflow-y:auto}
#chat{flex:1;display:flex;flex-direction:column;background-size:cover;background-position:center;min-width:0}
.bar{background:var(--hd);padding:10px 14px;display:flex;align-items:center;gap:12px}
.bar .sp{flex:1}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#333}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #222d34;cursor:pointer}
.row:hover{background:var(--hd)}
#empty{flex:1;display:flex;align-items:center;justify-content:center;color:#8696a0;text-align:center;padding:20px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:8px 10px;border-radius:10px;font-size:15px;word-break:break-word;backdrop-filter:blur(10px)}
.me{align-self:flex-end;background:rgba(0,168,132,.55)}
.th{align-self:flex-start;background:rgba(0,0,0,.55)}
.m img{max-width:100%;border-radius:8px;cursor:pointer}
.m audio{max-width:210px}
.m small{display:block;font-size:10px;opacity:.7;margin-top:2px}
.ib{background:none;border:0;color:var(--g);font-size:22px;padding:6px;cursor:pointer}
#foot{background:var(--hd);padding:8px;display:flex;gap:4px;align-items:center;padding-bottom:max(8px,env(safe-area-inset-bottom))}
#txt{flex:1;margin:0!important}
input[type=color]{width:28px;height:28px;border:0;padding:0;background:none}
@media(max-width:767px){#side{width:100%}#app.chatting #side{display:none}#app:not(.chatting) #chat{display:none}}
@media(min-width:768px){#back{display:none}}
#call,#inc{position:fixed;inset:0;background:#0b141a;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#lv{position:absolute;right:12px;bottom:110px;width:110px;height:150px;object-fit:cover;border-radius:10px;border:2px solid #fff;background:#222;z-index:2}
#ctop{position:absolute;top:0;left:0;right:0;padding:16px;background:linear-gradient(#000a,transparent);z-index:3}
.cb{position:absolute;bottom:30px;display:flex;gap:24px;z-index:3}
.rb{width:60px;height:60px;border-radius:50%;border:0;font-size:24px;color:#fff;background:#444;cursor:pointer}
.red{background:#ef4444}.grn{background:var(--g)}
</style>
</head>
<body>

<div id="login">
 <div class="card">
  <h1>whatsappDIaa</h1>
  <label style="cursor:pointer;display:inline-block;margin-bottom:12px">
   <img id="avp" class="av" style="width:80px;height:80px;border:2px solid var(--g)" alt="">
   <div style="font-size:12px;color:#8696a0">Tap to choose photo</div>
   <input type="file" id="avf" accept="image/*" class="hide">
  </label>
  <input type="text" id="un" placeholder="Username (letters, numbers)" maxlength="20">
  <input type="password" id="pw" placeholder="Family secret password">
  <button class="btn" id="enter">Enter</button>
  <p id="err" class="hide" style="color:#f87171;font-size:14px">Wrong password or missing info!</p>
 </div>
</div>

<div id="app" class="hide">
 <div id="side">
  <div class="bar">
   <img id="me" class="av" alt="">
   <b id="myname"></b><span class="sp"></span>
   <button class="ib" id="bgbtn" title="Chat background">🎨</button>
   <button class="ib" id="logout" title="Logout" style="color:#f87171">⏻</button>
   <input type="file" id="bgf" accept="image/*" class="hide">
  </div>
  <div id="list"></div>
 </div>
 <div id="chat">
  <div id="empty">Select a contact to start messaging.</div>
  <div id="active" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
   <div class="bar">
    <button class="ib" id="back" style="color:#aaa">←</button>
    <img id="cav" class="av" alt=""><b id="cname"></b><span class="sp"></span>
    <input type="color" id="col" value="#ffffff" title="Text color">
    <button class="ib" id="vbtn" title="Video call">📹</button>
    <button class="ib" id="abtn" title="Voice call">📞</button>
   </div>
   <div id="msgs"></div>
   <div id="foot">
    <button class="ib" id="pbtn" title="Photo">📎</button>
    <input type="file" id="pf" accept="image/*" class="hide">
    <input type="text" id="txt" placeholder="Message" autocomplete="off">
    <button class="ib" id="mic" title="Tap to record, tap again to send">🎤</button>
    <button class="ib" id="send">➤</button>
   </div>
  </div>
 </div>
</div>

<div id="inc" class="hide">
 <img id="iav" class="av" style="width:110px;height:110px;margin-bottom:16px" alt="">
 <h2 id="iname" style="font-weight:300"></h2>
 <p id="itype" style="color:#8696a0"></p>
 <div class="cb" style="position:static;margin-top:40px">
  <button class="rb red" id="decline">✖</button>
  <button class="rb grn" id="accept">✔</button>
 </div>
</div>

<div id="call" class="hide">
 <video id="rv" autoplay playsinline></video>
 <video id="lv" autoplay playsinline muted></video>
 <div id="ctop"><b id="cn"></b><div id="st" style="font-size:13px;color:#ccc">Connecting...</div></div>
 <div class="cb">
  <button class="rb" id="mute">🎙</button>
  <button class="rb red" id="hang">✖</button>
  <button class="rb" id="cam">📷</button>
 </div>
</div>

<script>
// ================= SETTINGS (edit these) =================
const SERVER_URL = "https://whatsappgggg.onrender.com";
const ICE = [
  { urls: 'stun:stun.l.google.com:19302' }
  // Add your TURN server here so calls work on any network, for example:
  // ,{ urls: 'turn:YOUR_HOST:443', username: 'USER', credential: 'PASS' }
];
// =========================================================

const $ = id => document.getElementById(id);
const socket = io(SERVER_URL, { reconnection: true });
let me = null, avatar = '', active = null, allUsers = [];
let peer = null, stream = null, callPeer = null, callType = 'video', inc = null;
const msgs = {}; // chat key -> messages
const NOTE = '__note';

function resize(file, max, q, cb) {
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const s = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas');
      c.width = i.width * s; c.height = i.height * s;
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', q));
    };
    i.src = r.result;
  };
  r.readAsDataURL(file);
}

// ---------- login ----------
$('avf').onchange = e => { const f = e.target.files[0]; if (f) resize(f, 128, .8, d => { avatar = d; $('avp').src = d; }); };
$('enter').onclick = () => {
  const u = $('un').value.trim(), p = $('pw').value;
  if (!/^[\w ]{1,20}$/.test(u) || !p || !avatar) { $('err').classList.remove('hide'); return; }
  me = { username: u, password: p, avatar };
  localStorage.setItem('diaa_user', JSON.stringify(me));
  start();
};
function start() {
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('me').src = me.avatar; $('myname').textContent = me.username;
  socket.emit('register_user', me);
  renderList();
}
socket.on('connect', () => { if (me) socket.emit('register_user', me); });
socket.on('auth_error', () => {
  localStorage.removeItem('diaa_user'); me = null;
  $('app').classList.add('hide'); $('login').classList.remove('hide'); $('err').classList.remove('hide');
});
$('logout').onclick = () => { if (confirm('Logout?')) { localStorage.removeItem('diaa_user'); location.reload(); } };

// ---------- contacts ----------
socket.on('update_user_list', users => { allUsers = users.filter(u => me && u.username.toLowerCase() !== me.username.toLowerCase()); renderList(); });
function row(img, name, sub, fn) {
  const d = document.createElement('div'); d.className = 'row';
  const i = document.createElement('img'); i.className = 'av'; i.src = img;
  const t = document.createElement('div');
  const b = document.createElement('b'); b.textContent = name;
  const s = document.createElement('div'); s.style.cssText = 'font-size:12px;color:#8696a0'; s.textContent = sub;
  t.append(b, s); d.append(i, t); d.onclick = fn; return d;
}
function renderList() {
  const l = $('list'); l.innerHTML = '';
  l.append(row('data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#00a884"/><text x="5" y="7" font-size="6" text-anchor="middle">📝</text></svg>'),
    'Note to Self', 'Your private notes', () => openChat({ key: NOTE, name: 'Note to Self', avatar: '', note: true })));
  if (!allUsers.length) { const p = document.createElement('p'); p.style.cssText = 'text-align:center;color:#8696a0;font-size:14px'; p.textContent = 'No one else yet. (Server may be waking up)'; l.append(p); }
  allUsers.forEach(u => l.append(row(u.avatar, u.username, 'Tap to chat', () => openChat({ key: u.username.toLowerCase(), name: u.username, avatar: u.avatar }))));
}

// ---------- chat ----------
function openChat(c) {
  active = c;
  $('empty').classList.add('hide'); $('active').classList.remove('hide');
  $('cname').textContent = c.name; $('cav').src = c.avatar || ''; $('cav').style.visibility = c.avatar ? 'visible' : 'hidden';
  ['vbtn', 'abtn', 'mic', 'pbtn'].forEach(id => $(id).classList.toggle('hide', !!c.note));
  $('msgs').innerHTML = '';
  if (c.note) JSON.parse(localStorage.getItem('diaa_notes') || '[]').forEach(draw);
  else (msgs[c.key] || []).forEach(draw);
  $('app').classList.add('chatting');
}
$('back').onclick = () => { active = null; $('app').classList.remove('chatting'); $('active').classList.add('hide'); $('empty').classList.remove('hide'); };

function draw(m) {
  const mine = m.from === me.username;
  const d = document.createElement('div'); d.className = 'm ' + (mine ? 'me' : 'th'); d.dataset.id = m.id; d.style.color = m.color || '#fff';
  if (m.type === 'photo') { const i = new Image(); i.src = m.text; i.onclick = () => window.open(m.text); d.append(i); }
  else if (m.type === 'voice') { const a = document.createElement('audio'); a.controls = true; a.src = m.text; d.append(a); }
  else d.append(document.createTextNode(m.text));
  const s = document.createElement('small'); s.textContent = m.time;
  if (mine) { const x = document.createElement('span'); x.textContent = ' 🗑'; x.style.cursor = 'pointer'; x.onclick = () => del(m); s.append(x); }
  d.append(s); $('msgs').append(d); $('msgs').scrollTop = 1e9;
}
function add(key, m) { (msgs[key] = msgs[key] || []).push(m); if (active && active.key === key) draw(m); }
function send(type, text) {
  if (!active || !text) return;
  const m = { id: Date.now() + '' + Math.random().toString(36).slice(2), from: me.username, to: active.name, text, type,
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), color: $('col').value };
  if (active.note) {
    const n = JSON.parse(localStorage.getItem('diaa_notes') || '[]'); n.push(m); localStorage.setItem('diaa_notes', JSON.stringify(n)); draw(m);
  } else { socket.emit('send_message', m); add(active.key, m); }
}
function del(m) {
  if (active.note) { const n = JSON.parse(localStorage.getItem('diaa_notes') || '[]').filter(x => x.id !== m.id); localStorage.setItem('diaa_notes', JSON.stringify(n)); }
  else { socket.emit('delete_message', { id: m.id }); msgs[active.key] = (msgs[active.key] || []).filter(x => x.id !== m.id); }
  const e = document.querySelector('[data-id="' + m.id + '"]'); if (e) e.remove();
}
socket.on('receive_message', m => add(m.from.toLowerCase(), m));
socket.on('message_deleted', ({ id }) => {
  for (const k in msgs) msgs[k] = msgs[k].filter(x => x.id !== id);
  const e = document.querySelector('[data-id="' + id + '"]'); if (e) e.remove();
});
$('send').onclick = () => { const t = $('txt').value.trim(); if (t) { send('text', t); $('txt').value = ''; } };
$('txt').onkeydown = e => { if (e.key === 'Enter') $('send').click(); };
$('pbtn').onclick = () => $('pf').click();
$('pf').onchange = e => { const f = e.target.files[0]; if (f) resize(f, 1024, .7, d => send('photo', d)); e.target.value = ''; };

// ---------- voice notes (tap to start, tap to send) ----------
let rec = null, chunks = [];
$('mic').onclick = async () => {
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(s); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      s.getTracks().forEach(t => t.stop()); $('mic').textContent = '🎤';
      const r = new FileReader(); r.onload = () => send('voice', r.result);
      r.readAsDataURL(new Blob(chunks, { type: rec.mimeType }));
    };
    rec.start(); $('mic').textContent = '⏹';
  } catch (e) { alert('Microphone blocked. Allow it in your browser settings.'); }
};

// ---------- calls ----------
async function media(type) {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
    $('lv').srcObject = stream; $('lv').classList.toggle('hide', type !== 'video');
    $('call').classList.remove('hide'); return true;
  } catch (e) { alert('Camera/mic error: ' + e.message); return false; }
}
function mk(init, sig) {
  peer = new SimplePeer({ initiator: init, trickle: false, stream, config: { iceServers: ICE } });
  const t = setTimeout(() => { if ($('st').textContent !== 'Connected') { alert('Call failed. A TURN server may be needed.'); end(); } }, 25000);
  peer.on('signal', d => init
    ? socket.emit('call_user', { userToCall: callPeer, signal: d, type: callType })
    : socket.emit('answer_call', { signal: d, to: callPeer }));
  peer.on('stream', s => {
    clearTimeout(t);
    const v = $('rv'); v.srcObject = s; $('st').textContent = 'Connected';
    v.play().catch(() => { v.muted = true; v.play(); v.onclick = () => { v.muted = false; v.play(); }; }); // autoplay fix
  });
  peer.on('error', e => { clearTimeout(t); alert('Call error: ' + e.message); end(); });
  if (sig) peer.signal(sig);
}
async function startCall(type) {
  if (!active || active.note) return;
  callType = type; callPeer = active.key; $('cn').textContent = active.name; $('st').textContent = 'Calling...';
  if (await media(type)) mk(true);
}
$('vbtn').onclick = () => startCall('video');
$('abtn').onclick = () => startCall('voice');
socket.on('incoming_call', d => {
  inc = d; callType = d.type;
  $('iname').textContent = d.name + ' is calling...'; $('itype').textContent = d.type === 'video' ? 'Video call' : 'Voice call';
  const u = allUsers.find(x => x.username === d.from); $('iav').src = u ? u.avatar : '';
  $('inc').classList.remove('hide');
});
$('accept').onclick = async () => {
  $('inc').classList.add('hide'); callPeer = inc.from.toLowerCase(); $('cn').textContent = inc.name; $('st').textContent = 'Connecting...';
  if (await media(callType)) mk(false, inc.signal); else socket.emit('end_call', { to: callPeer });
};
$('decline').onclick = () => { socket.emit('end_call', { to: inc.from.toLowerCase() }); $('inc').classList.add('hide'); inc = null; };
socket.on('call_accepted', d => { if (peer) peer.signal(d.signal); });
function end(remote) {
  if (!remote && callPeer) socket.emit('end_call', { to: callPeer });
  if (peer) { peer.destroy(); peer = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('rv').srcObject = null; $('lv').srcObject = null; $('rv').muted = false;
  $('call').classList.add('hide'); $('inc').classList.add('hide'); callPeer = null;
}
socket.on('call_ended', () => end(true));
socket.on('call_unavailable', () => { alert('That person is offline.'); end(true); });
$('hang').onclick = () => end();
$('mute').onclick = () => { if (stream) { const t = stream.getAudioTracks()[0]; t.enabled = !t.enabled; $('mute').style.opacity = t.enabled ? 1 : .4; } };
$('cam').onclick = () => { if (stream && stream.getVideoTracks()[0]) { const t = stream.getVideoTracks()[0]; t.enabled = !t.enabled; $('cam').style.opacity = t.enabled ? 1 : .4; } };

// ---------- background & text color ----------
function bg(u) { $('chat').style.backgroundImage = u ? "url('" + u + "')" : 'none'; }
$('bgbtn').onclick = () => $('bgf').click();
$('bgf').onchange = e => { const f = e.target.files[0]; if (f) resize(f, 1280, .6, d => { try { localStorage.setItem('diaa_bg', d); } catch (x) {} bg(d); }); };
$('col').value = localStorage.getItem('diaa_color') || '#ffffff';
$('col').onchange = e => localStorage.setItem('diaa_color', e.target.value);
bg(localStorage.getItem('diaa_bg'));

// ---------- boot ----------
const saved = localStorage.getItem('diaa_user');
if (saved) { try { me = JSON.parse(saved); start(); } catch (e) { localStorage.removeItem('diaa_user'); } }
</script>
</body>
</html>
