            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const avatar = document.getElementById('avatarPreview').src;
            if (username && !avatar.includes('placeholder') && password === FAMILY_SECRET_PASSWORD) {
                myData = { username, password, avatar };
                localStorage.setItem('diaa_user', JSON.stringify(myData));
                showApp();
            } else { document.getElementById('loginError').classList.remove('hidden'); }
        }
        function showApp() { socket.emit('register_user', myData); document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); document.getElementById('myAvatar').src = myData.avatar; }
        
        function openProfileEdit() { document.getElementById('profileNameInput').value = myData.username; document.getElementById('profileAvatarPreview').src = myData.avatar; document.getElementById('profileModal').classList.remove('hidden'); }
        function closeProfileEdit() { document.getElementById('profileModal').classList.add('hidden'); }
        function updateProfileAvatar(e) { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => document.getElementById('profileAvatarPreview').src = ev.target.result; reader.readAsDataURL(file); } }
        function saveProfile() {
            const newName = document.getElementById('profileNameInput').value.trim();
            const newAvatar = document.getElementById('profileAvatarPreview').src;
            if (newName && newAvatar) {
                myData.username = newName; myData.avatar = newAvatar;
                localStorage.setItem('diaa_user', JSON.stringify(myData));
                document.getElementById('myAvatar').src = newAvatar;
                socket.emit('register_user', myData);
                closeProfileEdit();
            }
        }

        function logoutAccount() { if(confirm("Logout?")) { localStorage.removeItem('diaa_user'); location.reload(); } }
        function deleteAccount() { if(confirm("Delete account?")) { if(confirm("Really sure?")) { localStorage.clear(); location.reload(); } } }

        function uploadRingtone(e) { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => { localStorage.setItem('diaa_ringtone', ev.target.result); document.getElementById('ringtone').src = ev.target.result; alert("Ringtone uploaded!"); }; reader.readAsDataURL(file); } }
        function setRingtone(url) { document.getElementById('ringtoneUrlInput').value = url; document.getElementById('ringtone').src = url; document.getElementById('ringtone').play().then(() => { setTimeout(() => { const a = document.getElementById('ringtone'); a.pause(); a.currentTime = 0; }, 2000); }).catch(e => {}); }
        function saveRingtoneUrl() { const url = document.getElementById('ringtoneUrlInput').value.trim(); if (url && url !== 'Uploaded file') { localStorage.setItem('diaa_ringtone', url); document.getElementById('ringtone').src = url; alert("Ringtone saved!"); } }

        socket.on('update_user_list', (users) => { allUsers = users.filter(u => u.username !== myData.username); renderUserList(allUsers); });

        function renderUserList(usersToRender) {
            const list = document.getElementById('userList');
            const noteBtn = `<div onclick="openNotes()" class="flex items-center p-3 hover:bg-wa_header cursor-pointer border-b border-wa_border transition mb-2 bg-wa_input/30 rounded-lg"><img src="https://img.icons8.com/color/96/edit--v1.png" class="w-12 h-12 rounded-full mr-3"><div><h3 class="font-bold text-wa_green">Note to Self</h3><p class="text-xs text-gray-400">Your private notes</p></div></div>`;
            let html = noteBtn;
            if(usersToRender.length === 0) { html += '<p class="text-center text-gray-500 mt-4 text-sm">No users found. (Server might be waking up)</p>'; }
            else { usersToRender.forEach(u => { html += `<div class="flex items-center justify-between p-3 hover:bg-wa_header border-b border-wa_border transition"><div class="flex items-center cursor-pointer flex-1" onclick="openChat('${u.username}', '${u.avatar}')"><img src="${u.avatar}" class="w-12 h-12 rounded-full mr-3"><div><h3 class="font-bold">${u.username}</h3><p class="text-xs text-gray-400">Tap to chat</p></div></div></div>`; }); }
            list.innerHTML = html;
        }

        function filterUsers() { const query = document.getElementById('searchUser').value.toLowerCase(); renderUserList(allUsers.filter(u => u.username.toLowerCase().includes(query))); }
        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addUserInput').value = ''; }
        function searchAndAddUser() { const name = document.getElementById('addUserInput').value.trim().toLowerCase(); if(!name) return; document.getElementById('searchUser').value = name; filterUsers(); closeAddModal(); }

        function openNotes() {
            activeUser = { username: 'Note to Self', avatar: 'https://img.icons8.com/color/96/edit--v1.png', isNote: true };
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('activeChatUI').classList.remove('hidden');
            document.getElementById('chatName').innerText = 'Note to Self';
            document.getElementById('chatAvatar').src = 'https://img.icons8.com/color/96/edit--v1.png';
            document.getElementById('callVideoBtn').style.display = 'none';
            document.getElementById('callVoiceBtn').style.display = 'none';
            document.getElementById('cameraBtn').style.display = 'none';
            document.getElementById('micBtn').style.display = 'none';
            document.getElementById('fileInput').parentElement.querySelector('button').style.display = 'none';
            loadNotes();
            if (window.innerWidth < 768) { document.getElementById('sidebar').style.display = 'none'; document.getElementById('chatArea').style.display = 'flex'; }
        }

        function loadNotes() {
            const area = document.getElementById('messagesArea'); area.innerHTML = '';
            const notes = JSON.parse(localStorage.getItem('diaa_notes') || '[]');
            notes.forEach(note => {
                const wrapper = document.createElement('div'); wrapper.className = 'message-wrapper flex flex-col max-w-[70%] self-end';
                wrapper.innerHTML = `<div class="glass-bubble text-white px-3 py-2 rounded-lg shadow text-sm relative group"><div class="message-text" style="color: ${note.color || '#ffffff'}">${note.text}</div><div class="flex justify-between items-center mt-1 gap-2"><span class="text-[10px] text-gray-300">${note.time}</span><button onclick="deleteNote('${note.id}', this)" class="text-[10px] text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button></div></div>`;
                area.appendChild(wrapper);
            }); area.scrollTop = area.scrollHeight;
        }
        function saveNote(msg) { const notes = JSON.parse(localStorage.getItem('diaa_notes') || '[]'); notes.push(msg); localStorage.setItem('diaa_notes', JSON.stringify(notes)); }
        function deleteNote(id, btn) { let notes = JSON.parse(localStorage.getItem('diaa_notes') || '[]'); notes = notes.filter(n => n.id !== id); localStorage.setItem('diaa_notes', JSON.stringify(notes)); btn.closest('.message-wrapper').remove(); }

        function openChat(username, avatar) {
            activeUser = { username, avatar, isNote: false };
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('activeChatUI').classList.remove('hidden');
            document.getElementById('chatName').innerText = username;
            document.getElementById('chatAvatar').src = avatar;
            document.getElementById('messagesArea').innerHTML = '';
            sentMessages.clear();
            document.getElementById('callVideoBtn').style.display = 'block';
            document.getElementById('callVoiceBtn').style.display = 'block';
            document.getElementById('cameraBtn').style.display = 'block';
            document.getElementById('micBtn').style.display = 'block';
            document.getElementById('fileInput').parentElement.querySelector('button').style.display = 'block';
            if (window.innerWidth < 768) { document.getElementById('sidebar').style.display = 'none'; document.getElementById('chatArea').style.display = 'flex'; }
        }

        function goBack() { if (window.innerWidth < 768) { document.getElementById('chatArea').style.display = 'none'; document.getElementById('sidebar').style.display = 'flex'; } document.getElementById('activeChatUI').classList.add('hidden'); document.getElementById('emptyState').classList.remove('hidden'); }

        function sendText() {
            const input = document.getElementById('msgInput'); const text = input.value.trim();
            if (text && activeUser) {
                const msgId = Date.now().toString() + Math.random().toString();
                const msg = { id: msgId, from: myData.username, to: activeUser.username, text, type: 'text', time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), color: document.getElementById('textColorPicker').value };
                if (activeUser.isNote) { saveNote(msg); loadNotes(); } 
                else { socket.emit('send_message', msg); appendMessage(msg); }
                input.value = '';
            }
        }

        function sendFile(event) {
            const file = event.target.files[0];
            if (file && activeUser && !activeUser.isNote) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const msgId = Date.now().toString() + Math.random().toString();
                    let type = 'file';
                    if (file.type.startsWith('image/')) type = 'photo';
                    else if (file.name.endsWith('.html') || file.name.endsWith('.htm')) type = 'html';
                    const msg = { id: msgId, from: myData.username, to: activeUser.username, text: e.target.result, fileName: file.name, type: type, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), color: document.getElementById('textColorPicker').value };
                    socket.emit('send_message', msg); appendMessage(msg);
                }; reader.readAsDataURL(file);
            } event.target.value = '';
        }

        socket.on('receive_message', (msg) => {
            if (!activeUser || activeUser.isNote) return; 
            if ((msg.to === myData.username || msg.from === myData.username) && (msg.from === activeUser.username || msg.to === activeUser.username)) {
                if (!sentMessages.has(msg.id)) { appendMessage(msg); sentMessages.add(msg.id); }
            }
        });

        function appendMessage(msg) {
            const area = document.getElementById('messagesArea');
            const isMe = msg.from === myData.username;
            const bubbleClass = isMe ? 'glass-bubble self-end' : 'glass-bubble-received self-start';
            const textColor = msg.color || '#ffffff';
            let content = msg.text;
            if (msg.type === 'voice') content = `<audio controls src="${msg.text}" class="w-48" style="playbackRate: ${document.getElementById('voiceEffect').value}"></audio>`;
            else if (msg.type === 'photo') content = `<img src="${msg.text}" class="max-w-full rounded-lg cursor-pointer" onclick="window.open(this.src)">`;
            else if (msg.type === 'video') content = `<video controls src="${msg.text}" class="max-w-full rounded-lg"></video>`;
            else if (msg.type === 'html') content = `<a href="${msg.text}" download="${msg.fileName || 'file.html'}" class="text-blue-400 underline"><i class="fas fa-file-code mr-2"></i>${msg.fileName || 'HTML File'}</a>`;
            else if (msg.type === 'file') content = `<a href="${msg.text}" download="${msg.fileName || 'file'}" class="text-blue-400 underline"><i class="fas fa-file mr-2"></i>${msg.fileName || 'File'}</a>`;
            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper flex flex-col max-w-[70%] ' + (isMe ? 'self-end' : 'self-start');
            wrapper.innerHTML = `<div class="${bubbleClass} text-white px-3 py-2 rounded-lg shadow text-sm relative group"><div class="message-text" style="color: ${textColor}">${content}</div><div class="flex justify-between items-center mt-1 gap-2"><span class="text-[10px] text-gray-300">${msg.time}</span>${isMe ? `<button onclick="deleteMessage('${msg.id}', this)" class="message-actions text-[10px] text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>` : ''}</div></div>`;
            area.appendChild(wrapper); area.scrollTop = area.scrollHeight;
        }

        function deleteMessage(msgId, btnElement) { btnElement.closest('.message-wrapper').remove(); socket.emit('delete_message', { id: msgId, from: myData.username }); }
        socket.on('message_deleted', (data) => { document.querySelectorAll('.message-wrapper').forEach(msgEl => { if (msgEl.innerHTML.includes(`'${data.id}'`)) msgEl.remove(); }); });

        async function startRecording() {
            if (isRecording || (activeUser && activeUser.isNote)) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream); audioChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = sendVoiceNote; mediaRecorder.start(); isRecording = true;
                const btn = document.getElementById('micBtn'); btn.classList.add('text-red-500', 'animate-pulse'); btn.innerHTML = '<i class="fas fa-stop"></i>';
            } catch (err) { alert("Microphone access denied!"); isRecording = false; }
        }
        function stopRecording() { if (!isRecording) return; if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(track => track.stop()); } isRecording = false; const btn = document.getElementById('micBtn'); btn.classList.remove('text-red-500', 'animate-pulse'); btn.innerHTML = '<i class="fas fa-microphone"></i>'; }
        function sendVoiceNote() {
            if (audioChunks.length === 0) return;
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader(); reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
                const msgId = Date.now().toString() + Math.random().toString();
                const msg = { id: msgId, from: myData.username, to: activeUser.username, text: reader.result, type: 'voice', time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), color: document.getElementById('textColorPicker').value };
                socket.emit('send_message', msg); appendMessage(msg); audioChunks = [];
            };
        }

        async function openCamera() {
            if (activeUser && activeUser.isNote) return;
            try {
                if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode }, audio: true });
                const videoEl = document.getElementById('cameraVideo'); videoEl.srcObject = cameraStream; videoEl.className = '';
                document.getElementById('cameraOverlay').classList.add('active'); currentCameraFilter = '';
            } catch (err) { alert("Camera access denied!"); }
        }
        function applyCameraFilter(filterClass) { const videoEl = document.getElementById('cameraVideo'); videoEl.className = filterClass; currentCameraFilter = filterClass; document.querySelectorAll('.filter-btn').forEach(btn => { btn.classList.remove('active'); if (btn.getAttribute('onclick').includes(filterClass)) btn.classList.add('active'); }); }
        function closeCamera() { if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); cameraStream = null; } document.getElementById('cameraOverlay').classList.remove('active'); document.getElementById('cameraRecordBtn').classList.remove('recording'); }
        function switchCamera() { facingMode = facingMode === 'user' ? 'environment' : 'user'; if (cameraStream) { cameraStream.getTracks().forEach(track => track.stop()); openCamera(); } }
        function startCameraRecording() { if (!cameraStream) return; cameraChunks = []; const mr = new MediaRecorder(cameraStream, { mimeType: 'video/webm' }); mr.ondataavailable = e => { if (e.data.size > 0) cameraChunks.push(e.data); }; mr.onstop = sendCameraMedia; mr.start(100); cameraRecorder = mr; document.getElementById('cameraRecordBtn').classList.add('recording'); }
        function stopCameraRecording() { if (cameraRecorder && cameraRecorder.state !== 'inactive') { cameraRecorder.stop(); document.getElementById('cameraRecordBtn').classList.remove('recording'); } }
        function sendCameraMedia() {
            if (cameraChunks.length === 0) { closeCamera(); return; }
            const blob = new Blob(cameraChunks, { type: 'video/webm' });
            const reader = new FileReader(); reader.readAsDataURL(blob);
            reader.onloadend = () => {
                const msgId = Date.now().toString() + Math.random().toString();
                const msg = { id: msgId, from: myData.username, to: activeUser.username, text: reader.result, type: 'video', filter: currentCameraFilter, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), color: document.getElementById('textColorPicker').value };
                socket.emit('send_message', msg); appendMessage(msg); closeCamera();
            };
        }

        async function startCall(type) {
            if (!activeUser || activeUser.isNote) return; callType = type;
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: type === 'video' ? { facingMode: "user" } : false, audio: true });
                const localVideo = document.getElementById('localVideo'); localVideo.srcObject = localStream; localVideo.play().catch(e => {}); localVideo.style.display = type === 'video' ? 'block' : 'none';
                document.getElementById('activeCallUI').classList.remove('hidden'); document.getElementById('activeCallName').innerText = activeUser.username; document.getElementById('activeCallAvatar').src = activeUser.avatar; document.getElementById('callStatus').innerText = "Connecting...";
                peer = new SimplePeer({ initiator: true, stream: localStream, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } });
                const timeout = setTimeout(() => { if (document.getElementById('callStatus').innerText !== "Connected") { alert("Connection failed. Server might be asleep. Refresh page."); endCall(); } }, 15000);
                peer.on('signal', data => { socket.emit('call_user', { userToCall: activeUser.username, signal: data, from: myData.username, name: myData.username, type: type }); });
                peer.on('connect', () => { clearTimeout(timeout); });
                peer.on('stream', remoteStream => { clearTimeout(timeout); const remoteVideo = document.getElementById('remoteVideo'); remoteVideo.srcObject = remoteStream; remoteVideo.style.display = 'block'; remoteVideo.play().catch(e => {}); document.getElementById('callStatus').innerText = "Connected"; });
                peer.on('error', err => { clearTimeout(timeout); alert("Call failed: " + err.message); endCall(); });
            } catch (err) { alert("Camera error: " + err.message); }
        }

        socket.on('incoming_call', (data) => { incomingSignal = data.signal; incomingCaller = { username: data.from, name: data.name }; callType = data.type || 'video'; document.getElementById('incomingName').innerText = `${data.name} is calling...`; document.getElementById('incomingCallType').innerText = callType === 'video' ? 'Video Call' : 'Voice Call'; document.getElementById('incomingCallUI').classList.remove('hidden'); document.getElementById('ringtone').play(); });

        async function acceptCall() {
            try {
                document.getElementById('incomingCallUI').classList.add('hidden'); document.getElementById('activeCallUI').classList.remove('hidden'); document.getElementById('activeCallName').innerText = incomingCaller.name; document.getElementById('ringtone').pause(); document.getElementById('callStatus').innerText = "Connecting...";
                localStream = await navigator.mediaDevices.getUserMedia({ video: callType === 'video' ? true : false, audio: true });
                const localVideo = document.getElementById('localVideo'); localVideo.srcObject = localStream; localVideo.play().catch(e => {}); localVideo.style.display = callType === 'video' ? 'block' : 'none';
                peer = new SimplePeer({ initiator: false, stream: localStream, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }] } });
                const timeout = setTimeout(() => { if (document.getElementById('callStatus').innerText !== "Connected") { alert("Connection failed. Refresh page."); endCall(); } }, 15000);
                peer.on('signal', data => { socket.emit('answer_call', { signal: data, to: incomingCaller.username }); });
                peer.on('connect', () => { clearTimeout(timeout); });
                peer.on('stream', remoteStream => { clearTimeout(timeout); const remoteVideo = document.getElementById('remoteVideo'); remoteVideo.srcObject = remoteStream; remoteVideo.style.display = 'block'; remoteVideo.play().catch(e => {}); document.getElementById('callStatus').innerText = "Connected"; });
                peer.on('error', err => { clearTimeout(timeout); alert("Call failed: " + err.message); endCall(); });
                peer.signal(incomingSignal);
            } catch (err) { alert("Camera error: " + err.message); }
        }

        function declineCall() { document.getElementById('incomingCallUI').classList.add('hidden'); document.getElementById('ringtone').pause(); }
        socket.on('call_accepted', (data) => { if (peer) peer.signal(data.signal); });
        function endCall() { document.getElementById('activeCallUI').classList.add('hidden'); document.getElementById('incomingCallUI').classList.add('hidden'); document.getElementById('ringtone').pause(); if (peer) { peer.destroy(); peer = null; } if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; } document.getElementById('remoteVideo').srcObject = null; document.getElementById('localVideo').srcObject = null; }
        function toggleMute() { isMuted = !isMuted; if (localStream) localStream.getAudioTracks()[0].enabled = !isMuted; }
        function toggleVideo() { isVideoOff = !isVideoOff; if (localStream && callType === 'video') localStream.getVideoTracks()[0].enabled = !isVideoOff; }

        function openBgModal() { document.getElementById('bgModal').classList.remove('hidden'); } function closeBgModal() { document.getElementById('bgModal').classList.add('hidden'); }
        function uploadBg(event) { const file = event.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (e) => { const result = e.target.result; const isVideo = file.type.startsWith('video/'); localStorage.setItem('diaa_bg', result); localStorage.setItem('diaa_bg_type', isVideo ? 'video' : 'image'); applyBackground(result, isVideo); closeBgModal(); }; reader.readAsDataURL(file); } }
        function applyBgUrl() { const url = document.getElementById('bgUrlInput').value.trim(); if (url) { const isVideo = url.match(/\.(mp4|webm|ogg|mov)(\?|$)/i); localStorage.setItem('diaa_bg', url); localStorage.setItem('diaa_bg_type', isVideo ? 'video' : 'image'); applyBackground(url, isVideo); closeBgModal(); } }
        function applyBackground(url, isVideo) { const imageLayer = document.getElementById('bgImageLayer'); const videoLayer = document.getElementById('bgVideo'); if (isVideo) { imageLayer.style.backgroundImage = 'none'; videoLayer.src = url; videoLayer.classList.remove('hidden'); } else { videoLayer.classList.add('hidden'); videoLayer.src = ""; imageLayer.style.backgroundImage = `url('${url}')`; } }
        function loadSavedBg() { const saved = localStorage.getItem('diaa_bg'); const savedType = localStorage.getItem('diaa_bg_type') || 'image'; if (saved) { applyBackground(saved, savedType === 'video'); } else { applyBackground('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2000&auto=format&fit=crop', false); } }
        function changeTextColor(color) { document.documentElement.style.setProperty('--msg-color', color); localStorage.setItem('diaa_text_color', color); }
        function loadSavedTextColor() { const saved = localStorage.getItem('diaa_text_color'); if (saved) { document.getElementById('textColorPicker').value = saved; changeTextColor(saved); } }
        function cycleVideoFilter() { currentFilterIndex = (currentFilterIndex + 1) % videoFilters.length; const filterClass = videoFilters[currentFilterIndex]; const remoteVideo = document.getElementById('remoteVideo'); const localVideo = document.getElementById('localVideo'); videoFilters.forEach(f => { if(f) { remoteVideo.classList.remove(f); localVideo.classList.remove(f); }}); if (filterClass) { remoteVideo.classList.add(filterClass); localVideo.classList.add(filterClass); } }
    </script>
</body>
</html>
