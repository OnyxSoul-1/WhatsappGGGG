<script>
// ================= SETTINGS (edit these) =================
const GIPHY_KEY = "HV5t1IMycYUOpUiADkcWlBMkuTSWl1In"; // paste your free GIPHY key between the quotes (developers.giphy.com)
const SERVER_URL = "https://whatsappgggg.onrender.com";
const ICE = [
  { urls: 'stun:stun.l.google.com:19302' }
  // Add your TURN server here so calls work on any network, for example:
  // ,{ urls: 'turn:YOUR_HOST:443', username: 'USER', credential: 'PASS' }
];
// =========================================================

const $ = id => document.getElementById(id);
const socket = io(SERVER_URL, { reconnection: true });
let me = null, avatar = '', active = null, allUsers = [];
let peer = null, stream = null, callPeer = null, callType = 'video', inc = null;
const msgs = {}; // chat key -> messages
const NOTE = '__note', GRP = '__group';
const nick = JSON.parse(localStorage.getItem('diaa_nicks') || '{}');
const dn = (k, n) => nick[k] || n;
const ic = n => '<svg class="i"><use href="#i-' + n + '"/></svg>';

function resize(file, max, q, cb) {
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const s = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas');
      c.width = i.width * s; c.height = i.height * s;
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', q));
    };
    i.src = r.result;
  };
  r.readAsDataURL(file);
}

// ---------- login ----------
$('avf').onchange = e => { const f = e.target.files[0]; if (f) resize(f, 128, .8, d => { avatar = d; $('avp').src = d; }); };
$('enter').onclick = () => {
  const u = $('un').value.trim(), p = $('pw').value;
  if (!/^[\w ]{1,20}$/.test(u) || !p || !avatar) { $('err').classList.remove('hide'); return; }
  me = { username: u, password: p, avatar };
  localStorage.setItem('diaa_user', JSON.stringify(me));
  start();
};
function start() {
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('me').src = me.avatar; $('myname').textContent = me.username;
  socket.emit('register_user', me);
  renderList();
}
socket.on('connect', () => { if (me) socket.emit('register_user', me); });
socket.on('auth_error', () => {
  localStorage.removeItem('diaa_user'); me = null;
  $('app').classList.add('hide'); $('login').classList.remove('hide'); $('err').classList.remove('hide');
});
$('logout').onclick = () => { if (confirm('Logout?')) { localStorage.removeItem('diaa_user'); location.reload(); } };

// ---------- contacts ----------
socket.on('update_user_list', users => { allUsers = users.filter(u => me && u.username.toLowerCase() !== me.username.toLowerCase()); renderList(); subline(); });
function row(img, name, sub, fn) {
  const d = document.createElement('div'); d.className = 'row';
  const i = document.createElement('img'); i.className = 'av'; i.src = img;
  const t = document.createElement('div');
  const b = document.createElement('b'); b.textContent = name;
  const s = document.createElement('div'); s.style.cssText = 'font-size:12px;color:#8696a0'; s.textContent = sub;
  t.append(b, s); d.append(i, t); d.onclick = fn; return d;
}
function renderList() {
  const l = $('list'); l.innerHTML = '';
  l.append(row('data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><defs><linearGradient id="g"><stop stop-color="#00f0c8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="24" height="24" fill="url(#g)"/><path d="M7 5h7l3 3v11H7zM9 12h6M9 15h4" fill="none" stroke="#06101c" stroke-width="1.6" stroke-linecap="round"/></svg>'),
    'Note to Self', 'Your private notes', () => openChat({ key: NOTE, name: 'Note to Self', avatar: '', note: true })));
  l.append(row('data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><defs><linearGradient id="g"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#00f0c8"/></linearGradient></defs><rect width="24" height="24" fill="url(#g)"/><g fill="none" stroke="#06101c" stroke-width="1.6" stroke-linecap="round"><circle cx="9" cy="9" r="2.5"/><circle cx="16" cy="10" r="2"/><path d="M4 18c0-3 2.5-4.5 5-4.5s5 1.5 5 4.5M15 14c2.5 0 5 1 5 4"/></g></svg>'), 'Family Group', unread[GRP] ? '● ' + unread[GRP] + ' new' : 'Everyone', () => openChat({ key: GRP, name: 'Family Group', avatar: '', group: true })));
  if (!allUsers.length) { const p = document.createElement('p'); p.style.cssText = 'text-align:center;color:#8696a0;font-size:14px'; p.textContent = 'No one else yet. (Server may be waking up)'; l.append(p); }
  allUsers.forEach(u => {
    const k = u.username.toLowerCase(), r = row(u.avatar, dn(k, u.username), unread[k] ? '● ' + unread[k] + ' new' : (u.status || (u.online ? 'online' : (nick[k] ? u.username : 'offline'))), () => openChat({ key: k, name: u.username, avatar: u.avatar }));
    if (u.online) r.firstChild.classList.add('on'); l.append(r);
  });
}

// ---------- chat ----------
function openChat(c) {
  active = c;
  $('empty').classList.add('hide'); $('active').classList.remove('hide');
  $('cname').textContent = c.note ? c.name : dn(c.key, c.name); $('cav').src = c.avatar || ''; $('cav').style.visibility = c.avatar ? 'visible' : 'hidden';
  ['ebtn', 'vbtn', 'abtn', 'mic', 'pbtn', 'cbtn'].forEach(id => $(id).classList.toggle('hide', !!c.note));
  if (c.group) ['ebtn', 'vbtn', 'abtn'].forEach(id => $(id).classList.add('hide'));
  $('msgs').innerHTML = '';
  if (c.note) JSON.parse(localStorage.getItem('diaa_notes') || '[]').forEach(draw);
  else (msgs[c.key] || []).forEach(draw);
  delete unread[c.key]; renderList(); markRead(c.key); subline(); showPin(); $('sbar').classList.add('hide'); $('sq').value = ''; $('app').classList.add('chatting');
}
$('back').onclick = () => { active = null; $('app').classList.remove('chatting'); $('active').classList.add('hide'); $('empty').classList.remove('hide'); };

function draw(m) {
  const mine = m.from === me.username, grp = m.to === GRP;
  const d = document.createElement('div'); d.className = 'm ' + (mine ? 'me' : 'th'); d.dataset.id = m.id; d.style.color = m.color || '#fff';
  if ((m.fresh && !mine) || (mine && m.type === 'voice')) { d.classList.add('new'); m.fresh = false; }
  if (grp && !mine) { const n = document.createElement('div'); n.className = 'who'; n.textContent = dn(m.from.toLowerCase(), m.from); d.append(n); }
  if (m.reply) { const q = document.createElement('div'); q.className = 'rq'; q.textContent = m.reply.name + ': ' + m.reply.text; d.append(q); }
  if (m.type === 'photo') { const i = new Image(); i.src = m.text; i.onclick = () => { $('lbi').src = m.text; $('lb').classList.remove('hide'); }; d.append(i); }
  else if (m.type === 'gif') { const i = new Image(); i.src = m.text; i.onclick = () => { $('lbi').src = m.text; $('lb').classList.remove('hide'); }; d.classList.add('gm'); d.append(i); }
  else if (m.type === 'poll') d.append(pollEl(m));
  else if (m.type === 'voice') d.append(voiceEl(m.text));
  else if (m.type === 'video') { const v = document.createElement('video'); v.controls = true; v.playsInline = true; v.src = m.text + '#t=0.1'; v.preload = 'metadata'; v.style.cssText = 'max-width:100%;border-radius:12px'; d.append(v); }
  else if (m.type === 'html' || m.type === 'file') { const l = document.createElement('a'); l.href = m.text; l.download = m.fileName || 'file'; l.className = 'fl'; l.innerHTML = ic('file'); l.append(m.fileName || 'File'); d.append(l); }
  else { if (/^(\p{Extended_Pictographic}\uFE0F?){1,3}$/u.test(m.text)) d.classList.add('stk'); d.append(linkify(m.text)); const u = firstUrl(m.text); if (u) d.append(linkCard(u)); }
  const rx = document.createElement('div'); rx.className = 'rx'; rx.textContent = rxText(m); d.append(rx);
  const s = document.createElement('small'); s.textContent = m.time;
  if (mine && active && !active.note && !grp) { const t = document.createElement('span'); t.className = 'tk ' + (m.status || 'sent'); t.dataset.tk = m.id; t.innerHTML = tkh(m.status || 'sent'); s.append(t); }
  d.append(s);
  d.onclick = e => { if (!e.target.closest('audio,video,button,a,img,select')) openAct(m); };
  $('msgs').append(d); $('msgs').scrollTop = 1e9;
}
function add(key, m) { (msgs[key] = msgs[key] || []).push(m); if (active && active.key === key) draw(m); }
function send(type, text, fn) {
  if (!active || !text) return;
  const m = { id: Date.now() + '' + Math.random().toString(36).slice(2), from: me.username, to: active.group ? GRP : active.name, text, type, fileName: fn, ttl: active.note ? undefined : (ttl[active.key] || undefined), status: 'sent', reply: replyTo ? { name: replyTo.from, text: prev(replyTo) } : undefined,
    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), color: $('col').value };
  replyTo = null; $('rbar').classList.add('hide');
  if (m.ttl) m.exp = Date.now() + m.ttl * 1000;
  if (active.note) {
    const n = JSON.parse(localStorage.getItem('diaa_notes') || '[]'); n.push(m); localStorage.setItem('diaa_notes', JSON.stringify(n)); draw(m);
  } else { emitQ('send_message', m); add(active.key, m); }
}
function del(m) {
  if (active.note) { const n = JSON.parse(localStorage.getItem('diaa_notes') || '[]').filter(x => x.id !== m.id); localStorage.setItem('diaa_notes', JSON.stringify(n)); }
  else { socket.emit('delete_message', { id: m.id }); msgs[active.key] = (msgs[active.key] || []).filter(x => x.id !== m.id); }
  const e = document.querySelector('[data-id="' + m.id + '"]'); if (e) e.remove();
}
socket.on('receive_message', m => {
  const k = m.to === GRP ? GRP : m.from.toLowerCase(); m.fresh = true; if (m.ttl) m.exp = Date.now() + m.ttl * 1000; add(k, m); ping(); if (navigator.vibrate) navigator.vibrate(60);
  if (!active || active.key !== k) { unread[k] = (unread[k] || 0) + 1; renderList(); } else markRead(k);
  if (document.hidden) notif(m.to === GRP ? 'Family Group' : dn(m.from.toLowerCase(), m.from), (m.to === GRP ? m.from + ': ' : '') + prev(m));
});
socket.on('message_deleted', ({ id }) => {
  for (const k in msgs) msgs[k] = msgs[k].filter(x => x.id !== id);
  const e = document.querySelector('[data-id="' + id + '"]'); if (e) e.remove();
});
$('send').onclick = () => { const t = $('txt').value.trim(); if (t) { send('text', t); $('txt').value = ''; $('send').classList.add('go'); setTimeout(() => $('send').classList.remove('go'), 450); } };
$('txt').onkeydown = e => { if (e.key === 'Enter') $('send').click(); };
$('pbtn').onclick = () => $('pf').click();
$('pf').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (f.type.startsWith('image/')) return resize(f, 1024, .7, d => send('photo', d));
  if (f.size > 3e6) return alert('File too big (max 3 MB)');
  const r = new FileReader(); r.onload = () => send(/\.html?$/i.test(f.name) ? 'html' : 'file', r.result, f.name); r.readAsDataURL(f);
};

$('ebtn').onclick = () => {
  if (!active || active.note) return;
  const v = prompt('Nickname for ' + active.name + ' (leave empty to reset)', nick[active.key] || '');
  if (v === null) return;
  if (v.trim()) nick[active.key] = v.trim().slice(0, 30); else delete nick[active.key];
  localStorage.setItem('diaa_nicks', JSON.stringify(nick)); // saved only on this device
  $('cname').textContent = dn(active.key, active.name); renderList();
};

// ---------- voice notes (tap to start, tap to send) ----------
let rec = null, chunks = [];
$('mic').onclick = async () => {
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(s); chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => {
      s.getTracks().forEach(t => t.stop()); $('mic').innerHTML = ic('mic'); $('mic').classList.remove('recing'); clearInterval(rtmr); $('txt').placeholder = 'Message';
      sendVoice(new Blob(chunks, { type: rec.mimeType }));
    };
    rec.start(); $('mic').innerHTML = ic('stop'); $('mic').classList.add('recing'); let sec = 0; rtmr = setInterval(() => $('txt').placeholder = 'Recording ' + fmt(++sec) + ' · tap to send', 1000);
  } catch (e) { alert('Microphone blocked. Allow it in your browser settings.'); }
};

// ---------- calls ----------
async function media(type) {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: type === 'video', audio: true });
    $('lv').srcObject = stream; $('lv').classList.toggle('hide', type !== 'video');
    $('call').classList.remove('hide'); return true;
  } catch (e) { alert('Camera/mic error: ' + e.message); return false; }
}
function mk(init, sig) {
  peer = new SimplePeer({ initiator: init, trickle: false, stream, config: { iceServers: ICE } });
  const t = setTimeout(() => { if ($('st').textContent !== 'Connected') { alert('Call failed. A TURN server may be needed.'); end(); } }, 25000);
  peer.on('signal', d => init
    ? socket.emit('call_user', { userToCall: callPeer, signal: d, type: callType })
    : socket.emit('answer_call', { signal: d, to: callPeer }));
  peer.on('stream', s => {
    clearTimeout(t);
    const v = $('rv'); v.srcObject = s; $('st').textContent = 'Connected';
    v.play().catch(() => { v.muted = true; v.play(); v.onclick = () => { v.muted = false; v.play(); }; }); // autoplay fix
  });
  peer.on('iceStateChange', st => { if (st === 'disconnected') $('st').textContent = 'Connection unstable...'; else if (st === 'connected' || st === 'completed') $('st').textContent = 'Connected'; });
  peer.on('error', e => { clearTimeout(t); alert('Call error: ' + e.message); end(); });
  if (sig) peer.signal(sig);
}
async function startCall(type) {
  if (!active || active.note || callPeer) return;
  callType = type; callPeer = active.key; $('cn').textContent = active.name; $('st').textContent = 'Calling...';
  if (await media(type)) mk(true);
}
$('vbtn').onclick = () => startCall('video');
$('abtn').onclick = () => startCall('voice');
socket.on('incoming_call', d => {
  inc = d; callType = d.type;
  $('iname').textContent = d.name + ' is calling...'; $('itype').textContent = d.type === 'video' ? 'Video call' : 'Voice call';
  const u = allUsers.find(x => x.username === d.from); $('iav').src = u ? u.avatar : '';
  $('inc').classList.remove('hide'); ringStart(); callNotif(d);
});
$('accept').onclick = async () => { ringStop();
  $('inc').classList.add('hide'); callPeer = inc.from.toLowerCase(); $('cn').textContent = inc.name; $('st').textContent = 'Connecting...';
  if (await media(callType)) mk(false, inc.signal); else socket.emit('end_call', { to: callPeer });
};
$('decline').onclick = () => { ringStop(); socket.emit('end_call', { to: inc.from.toLowerCase() }); $('inc').classList.add('hide'); inc = null; };
socket.on('call_accepted', d => { if (peer) peer.signal(d.signal); });
function end(remote) {
  ringStop(); ci = 0; $('rv').style.filter = $('lv').style.filter = '';
  if (!remote && callPeer) socket.emit('end_call', { to: callPeer });
  if (peer) { peer.destroy(); peer = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  $('rv').srcObject = null; $('lv').srcObject = null; $('rv').muted = false;
  $('call').classList.add('hide'); $('inc').classList.add('hide'); callPeer = null;
}
socket.on('call_ended', () => end(true));
socket.on('call_busy', ({ name }) => { alert(name + ' is on another call right now. Try again in a bit.'); end(true); });
socket.on('call_unavailable', () => { alert('That person is offline.'); end(true); });
$('hang').onclick = () => end();
$('mute').onclick = () => { if (stream) { const t = stream.getAudioTracks()[0]; t.enabled = !t.enabled; $('mute').style.opacity = t.enabled ? 1 : .4; } };
$('cam').onclick = () => { if (stream && stream.getVideoTracks()[0]) { const t = stream.getVideoTracks()[0]; t.enabled = !t.enabled; $('cam').style.opacity = t.enabled ? 1 : .4; } };

// ---------- background & text color ----------
function bg(u) { $('chat').style.backgroundImage = u ? "url('" + u + "')" : 'none'; }
$('bgbtn').onclick = () => $('bgf').click();
$('bgf').onchange = e => { const f = e.target.files[0]; if (f) resize(f, 1280, .6, d => { try { localStorage.setItem('diaa_bg', d); } catch (x) {} bg(d); }); };
$('col').value = localStorage.getItem('diaa_color') || '#ffffff';
$('col').onchange = e => localStorage.setItem('diaa_color', e.target.value);
bg(localStorage.getItem('diaa_bg'));

// ---------- new voice player ----------
const fmt = t => isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '0:00';
function voiceEl(src) {

$('mpoll').onclick = () => {
  if (active.note) return; $('menu').classList.add('hide');
  const q = (prompt('Poll question:') || '').trim(); if (!q) return;
  const o = (prompt('Answers, separated by commas (2 to 4):') || '').split(',').map(x => x.trim().slice(0, 40)).filter(Boolean).slice(0, 4);
  if (o.length < 2) return alert('A poll needs at least 2 answers.');
  send('poll', JSON.stringify({ q: q.slice(0, 100), o }));
};
function pollEl(m) { const w = document.createElement('div'); w.className = 'poll'; w.dataset.poll = m.id; fillPoll(w, m); return w; }
function fillPoll(w, m) {
  let p; try { p = JSON.parse(m.text); } catch (e) { w.textContent = 'Poll'; return; }
  const v = m.votes || {}, tot = Object.keys(v).length; w.innerHTML = '';
  const q = document.createElement('b'); q.textContent = p.q; w.append(q);
  p.o.forEach((o, i) => { const n = Object.values(v).filter(x => x === i).length, b = document.createElement('button'); b.className = 'po' + (v[me.username] === i ? ' on' : ''); b.style.setProperty('--w', (tot ? n / tot * 100 : 0) + '%'); b.textContent = o + ' · ' + n; b.onclick = () => vote(m, i); w.append(b); });
}
function updPoll(m) { const w = document.querySelector('[data-poll="' + m.id + '"]'); if (w) fillPoll(w, m); }
function vote(m, i) { (m.votes = m.votes || {})[me.username] = i; updPoll(m); if (active && !active.note) emitQ('react', { id: m.id, to: active.group ? GRP : active.name, emoji: 'vote:' + i }); }

// ---------- forward and pin ----------
const pins = JSON.parse(localStorage.getItem('diaa_pins') || '{}');
$('afwd').onclick = () => {
  $('act').classList.add('hide'); const l = $('fwdl'); l.innerHTML = '';
  const go = c => () => { const keep = active, rp = replyTo, n = $('msgs').children.length; active = c; replyTo = null; send(actM.type, actM.text, actM.fileName); active = keep; replyTo = rp; while ($('msgs').children.length > n) $('msgs').lastChild.remove(); $('fwd').classList.add('hide'); };
  l.append(row('', 'Family Group', 'Everyone', go({ key: GRP, name: 'Family Group', group: true })));
  allUsers.forEach(u => { const k = u.username.toLowerCase(); l.append(row(u.avatar, dn(k, u.username), u.online ? 'online' : 'offline', go({ key: k, name: u.username, avatar: u.avatar }))); });
  $('fwd').classList.remove('hide');
};
$('fwd').onclick = e => { if (e.target.id === 'fwd') $('fwd').classList.add('hide'); };
function showPin() { const p = active && pins[active.key]; $('pinbar').classList.toggle('hide', !p); if (p) $('ptxt').textContent = 'Pinned: ' + p.text; }
$('apin').onclick = () => { pins[active.key] = { id: actM.id, text: prev(actM) }; localStorage.setItem('diaa_pins', JSON.stringify(pins)); showPin(); $('act').classList.add('hide'); };
$('px').onclick = e => { e.stopPropagation(); delete pins[active.key]; localStorage.setItem('diaa_pins', JSON.stringify(pins)); showPin(); };
$('pinbar').onclick = () => { const p = pins[active.key], e = p && document.querySelector('[data-id="' + p.id + '"]'); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'center' }); };

// ---------- look (light theme, colors) and status ----------
const ACC = [['#00f0c8', '#8b5cf6'], ['#38bdf8', '#f472b6'], ['#fb923c', '#ef4444'], ['#a3e635', '#22c55e'], ['#f472b6', '#a855f7']];
function look() {
  const l = localStorage.getItem('diaa_light') === '1', a = ACC[+localStorage.getItem('diaa_acc') || 0];
  document.body.classList.toggle('light', l); document.documentElement.style.setProperty('--g', a[0]); document.documentElement.style.setProperty('--v', a[1]);
  $('thm').textContent = l ? 'Dark theme' : 'Light theme';
}
ACC.forEach((a, i) => { const b = document.createElement('button'); b.className = 'sw'; b.style.background = 'linear-gradient(135deg,' + a[0] + ',' + a[1] + ')'; b.onclick = () => { localStorage.setItem('diaa_acc', i); look(); }; $('acc').append(b); });
$('thm').onclick = () => { localStorage.setItem('diaa_light', localStorage.getItem('diaa_light') === '1' ? '0' : '1'); look(); };
$('stin').onchange = () => { if (!me) return; me.status = $('stin').value.trim().slice(0, 60); localStorage.setItem('diaa_user', JSON.stringify(me)); socket.emit('register_user', me); };
look();

// ---------- boot ----------
const saved = localStorage.getItem('diaa_user');
if (saved) { try { me = JSON.parse(saved); start(); } catch (e) { localStorage.removeItem('diaa_user'); } }
</script>
